<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" fill="none">
  <defs>
    <!-- Infinity Ribbon Gradients -->
    <linearGradient id="rucoLoopGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2228"/>
      <stop offset="45%" stop-color="#2D3742"/>
      <stop offset="70%" stop-color="#181D22"/>
      <stop offset="100%" stop-color="#0E1215"/>
    </linearGradient>

    <linearGradient id="rucoCopperRim" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E5A96A"/>
      <stop offset="35%" stop-color="#C78746"/>
      <stop offset="70%" stop-color="#8C5724"/>
      <stop offset="100%" stop-color="#DF9F5E"/>
    </linearGradient>

    <linearGradient id="rucoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C78746" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C78746" stop-opacity="0"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0E1215" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Group: 3D Infinity Symbol (Mobius loop) -->
  <g transform="translate(15, 12)">
    <!-- Subtle warm glow background -->
    <circle cx="55" cy="43" r="46" fill="url(#rucoGlow)"/>
    
    <!-- Outer Copper Rim Accent -->
    <path d="M 55,43 
             C 42,22 20,22 10,33 
             C -2,46 -2,66 10,77 
             C 22,89 45,86 55,65 
             C 65,44 88,41 100,53 
             C 112,64 112,84 100,97 
             C 90,108 68,108 55,87" 
          transform="scale(0.85) translate(4, -8)"
          fill="none" 
          stroke="url(#rucoCopperRim)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.85"/>

    <!-- Main Sleek Charcoal Loop with 3D Depth -->
    <path d="M 55,43 
             C 42,22 20,22 10,33 
             C -2,46 -2,66 10,77 
             C 22,89 45,86 55,65 
             C 65,44 88,41 100,53 
             C 112,64 112,84 100,97 
             C 90,108 68,108 55,87" 
          transform="scale(0.85) translate(4, -8)"
          fill="none" 
          stroke="url(#rucoLoopGrad1)" 
          stroke-width="9.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#softShadow)"/>

    <!-- Specular highlight line (copper metallic luster) -->
    <path d="M 22,34 
             C 34,26 48,34 55,44 
             C 62,54 76,62 88,54" 
          transform="scale(0.85) translate(4, -8)"
          fill="none" 
          stroke="#F3D1A5" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          opacity="0.6"/>
  </g>

  <!-- Typography: "ruco" + "web.ar" -->
  <g transform="translate(125, 68)">
    <!-- "ruco" in Bold Modern Sans -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Outfit', 'Cabinet Grotesk', -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.04em" fill="currentColor">
      ruco
    </text>
    <!-- "web.ar" in Accent Color -->
    <text x="110" y="0" font-family="'Plus Jakarta Sans', 'Outfit', 'Cabinet Grotesk', -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.03em" fill="#C78746">
      web<tspan font-weight="600" font-size="34" fill="#8A94A0">.ar</tspan>
    </text>
  </g>
</svg>
