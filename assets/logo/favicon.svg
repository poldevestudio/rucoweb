<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background circle gradient (matching Instagram avatar beige #F2E4D7) -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="85%" stop-color="#F2E4D7"/>
      <stop offset="100%" stop-color="#E8D5C2"/>
    </radialGradient>

    <!-- Loop Gradients -->
    <linearGradient id="loopDark" x1="15%" y1="20%" x2="85%" y2="80%">
      <stop offset="0%" stop-color="#1B2228"/>
      <stop offset="50%" stop-color="#303A44"/>
      <stop offset="100%" stop-color="#12161A"/>
    </linearGradient>

    <linearGradient id="copperEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2A566"/>
      <stop offset="50%" stop-color="#B87333"/>
      <stop offset="100%" stop-color="#E8BD8C"/>
    </linearGradient>
  </defs>

  <!-- Circular background -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#DFCFBE" stroke-width="1.5"/>

  <!-- Infinity loop outer copper border -->
  <path d="M 50,42 
           C 40,24 22,24 13,34 
           C 2,46 2,62 13,72 
           C 23,82 42,78 50,60 
           C 58,42 77,38 87,48 
           C 98,58 98,74 87,86 
           C 78,96 60,96 50,78" 
        transform="scale(0.7) translate(21.4, 5)"
        fill="none" 
        stroke="url(#copperEdge)" 
        stroke-width="10.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Infinity loop main dark body -->
  <path d="M 50,42 
           C 40,24 22,24 13,34 
           C 2,46 2,62 13,72 
           C 23,82 42,78 50,60 
           C 58,42 77,38 87,48 
           C 98,58 98,74 87,86 
           C 78,96 60,96 50,78" 
        transform="scale(0.7) translate(21.4, 5)"
        fill="none" 
        stroke="url(#loopDark)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Subtitle rucoweb.ar -->
  <text x="50" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle" fill="#20262B" letter-spacing="0.02em">
    rucoweb.ar
  </text>
</svg>
